<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>メルニクス語 相互翻訳ツール</title>
  <style>
    body { font-family: sans-serif; max-width: 650px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    textarea { width: 100%; height: 100px; font-size: 16px; margin-bottom: 10px; box-sizing: border-box; }
    .btn-group { margin-bottom: 20px; }
    button { padding: 12px 20px; font-size: 15px; cursor: pointer; background-color: #0066cc; color: #fff; border: none; border-radius: 4px; font-weight: bold; margin-right: 10px; margin-bottom: 5px; }
    button:hover { background-color: #0052a3; }
    .result-box { background: #f4f4f9; border: 1px solid #ccc; padding: 15px; border-radius: 5px; margin-bottom: 15px; }
    .result-title { font-weight: bold; font-size: 14px; color: #555; margin-bottom: 5px; }
    .result-content { font-size: 18px; font-weight: bold; white-space: pre-wrap; word-break: break-all; }
    .sub-content { font-size: 16px; color: #1a0dab; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>

  <h1>メルニクス語 相互翻訳ツール</h1>

  <label for="inputText">テキストを入力してください：</label>
  <textarea id="inputText" placeholder="日本語例: 邪魔をするな！&#10;メルニクス語例: ティー　グンティ　ウム　ティアン　バエヤー！"></textarea>

  <div class="btn-group">
    <button onclick="encodeFromJapanese()">日本語 ➔ メルニクス語（英訳経由）</button>
    <button onclick="decodeFromMelnics()">メルニクス語 ➔ アルファベット（日本語訳付き）</button>
  </div>

  <div class="result-box">
    <div class="result-title">変換結果（メイン表示）：</div>
    <div id="outputText" class="result-content">-</div>
  </div>

  <div class="result-box">
    <div class="result-title">補足（中間英文 / 日本語訳）：</div>
    <div id="subText" class="sub-content">-</div>
  </div>

  <script>
    // 固有名詞リスト（そのまま保持する単語）
    const specialProperNouns = [
      'メルディ',
      'ヒアデス',
      'セレスティア',
      'インフェリア'
    ];

    // 基本対応表（アルファベット -> メルニクス語）
    const baseMap = {
      'A': 'エ',   'B': 'ブ',   'C': 'ワ',   'D': 'ﾄﾞｩ', 'E': 'ン',
      'F': 'フ',   'G': 'グ',   'H': 'ア',   'I': 'ウ',   'J': 'ユ',
      'K': 'ク',   'L': 'ル',   'M': 'ﾄｩ',  'N': 'ム',   'O': 'イ',
      'P': 'プ',   'Q': 'ヨ',   'R': 'ﾃﾞｨ', 'S': 'ス',   'T': 'ﾃｨ',
      'U': 'オ',   'V': 'ヌ',   'W': 'バ',   'X': 'ズ',   'Y': 'ヤ',
      'Z': 'ツ'
    };

    // アルファベット -> カタカナ辞書
    const alphaToMelnics = {};
    for (const [k, v] of Object.entries(baseMap)) {
      alphaToMelnics[k] = v.normalize('NFKC');
    }

    // カタカナ -> アルファベット逆引きテーブル
    const melnicsToAlpha = [];
    for (const [letter, kana] of Object.entries(baseMap)) {
      melnicsToAlpha.push({ kana: kana.normalize('NFKC'), letter });
    }

    const extraPatterns = [
      { kana: 'ドゥ', letter: 'D' },
      { kana: 'ディ', letter: 'R' },
      { kana: 'トゥ', letter: 'M' },
      { kana: 'ティ', letter: 'T' },
      { kana: 'ィ', letter: 'O' },
      { kana: 'イ', letter: 'O' },
      { kana: 'エ', letter: 'A' },
      { kana: 'ェ', letter: 'A' },
      { kana: 'オ', letter: 'U' },
      { kana: 'ォ', letter: 'U' },
      { kana: 'ウ', letter: 'I' },
      { kana: 'ゥ', letter: 'I' },
      { kana: 'ア', letter: 'H' },
      { kana: 'ァ', letter: 'H' }
    ];

    for (const item of extraPatterns) {
      melnicsToAlpha.push({ kana: item.kana.normalize('NFKC'), letter: item.letter });
    }
    melnicsToAlpha.sort((a, b) => b.kana.length - a.kana.length);

    // 文末の促音「ッ」削除
    function cleanEmphasisSokuon(text) {
      return text.replace(/[ッﾂ]+(?=[\!\?！？\s　]|$)/g, '');
    }

    // 長音補正
    function resolveLongVowelsContextually(text) {
      let chars = Array.from(text);
      let resolved = "";

      for (let i = 0; i < chars.length; i++) {
        if (chars[i] === 'ー' || chars[i] === '―') {
          if (resolved.endsWith('イ') || resolved.endsWith('ィ') || resolved.endsWith('ｲ') || resolved.endsWith('ｨ')) {
            resolved += 'イ';
          } else if (resolved.endsWith('ティ') || resolved.endsWith('ﾃｨ') || resolved.endsWith('ディ') || resolved.endsWith('ﾃﾞｨ')) {
            resolved += 'イ';
          } else if (resolved.endsWith('ヤ') || resolved.endsWith('バ') || resolved.endsWith('ア') || resolved.endsWith('ァ') || resolved.endsWith('ウ') || resolved.endsWith('ｳ') || resolved.endsWith('オ') || resolved.endsWith('ｵ')) {
            continue;
          } else if (resolved.endsWith('エ') || resolved.endsWith('ェ')) {
            resolved += 'エ';
          } else {
            continue;
          }
        } else {
          resolved += chars[i];
        }
      }
      return resolved;
    }

    function formatSentenceCase(str) {
      if (!str || str.length === 0) return str;
      const lower = str.toLowerCase();
      return lower.charAt(0).toUpperCase() + lower.slice(1);
    }

    // 英字 ➔ メルニクス語変換
    function convertEnglishToMelnics(englishText) {
      let result = "";
      let i = 0;
      const normalizedInput = englishText.normalize('NFKC');

      while (i < normalizedInput.length) {
        let matched = false;

        // 固有名詞の判定（そのまま保持）
        for (const noun of specialProperNouns) {
          const normNoun = noun.normalize('NFKC');
          if (normalizedInput.startsWith(normNoun, i)) {
            result += noun;
            i += normNoun.length;
            matched = true;
            break;
          }
        }

        // 1文字ずつのアルファベット変換
        if (!matched) {
          const char = normalizedInput[i].toUpperCase();
          if (alphaToMelnics[char]) {
            result += alphaToMelnics[char];
          } else {
            result += normalizedInput[i];
          }
          i++;
        }
      }
      return result;
    }

    // 日本語 ➔ メルニクス語（英訳経由）
    async function encodeFromJapanese() {
      const rawInput = document.getElementById("inputText").value.trim();
      if (!rawInput) {
        document.getElementById("outputText").innerText = "-";
        document.getElementById("subText").innerText = "-";
        return;
      }

      document.getElementById("outputText").innerText = "翻訳＆変換中...";
      document.getElementById("subText").innerText = "英文を取得中...";

      try {
        // 固有名詞の保護処理
        let processText = rawInput;
        const placeholders = [];
        specialProperNouns.forEach((noun, idx) => {
          const ph = `__NOUN_${idx}__`;
          if (processText.includes(noun)) {
            placeholders.push({ ph, noun });
            processText = processText.split(noun).join(ph);
          }
        });

        // 翻訳API実行（日本語 -> 英語）
        const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(processText)}&langpair=ja|en`);
        const data = await response.json();

        if (data && data.responseData && data.responseData.translatedText) {
          let englishText = data.responseData.translatedText;

          // プレースホルダーを元の日本語固有名詞に戻す
          placeholders.forEach(({ ph, noun }) => {
            englishText = englishText.split(ph).join(noun);
          });

          // 英文をメルニクス語に変換
          const melnicsResult = convertEnglishToMelnics(englishText);

          document.getElementById("outputText").innerText = melnicsResult;
          document.getElementById("subText").innerText = `中間英文: ${englishText}`;
        } else {
          document.getElementById("outputText").innerText = "（翻訳エラーが発生しました）";
          document.getElementById("subText").innerText = "-";
        }
      } catch (err) {
        console.error(err);
        document.getElementById("outputText").innerText = "（通信エラーのため翻訳できませんでした）";
        document.getElementById("subText").innerText = "-";
      }
    }

    // 外部翻訳処理（英語 -> 日本語）
    function fetchJapaneseTranslation(englishText) {
      if (!englishText || englishText.trim().length === 0) {
        document.getElementById("subText").innerText = "-";
        return;
      }

      document.getElementById("subText").innerText = "日本語訳を取得中...";

      fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(englishText)}&langpair=en|ja`)
        .then(res => res.json())
        .then(data => {
          if (data && data.responseData && data.responseData.translatedText) {
            document.getElementById("subText").innerText = `日本語訳: ${data.responseData.translatedText}`;
          } else {
            document.getElementById("subText").innerText = "（日本語訳を取得できませんでした）";
          }
        })
        .catch(err => {
          console.warn("Translation API error:", err);
          document.getElementById("subText").innerText = "（オフラインまたは通信エラーのため翻訳スキップ）";
        });
    }

    // メルニクス語 ➔ アルファベット
    function decodeFromMelnics() {
      try {
        let rawInput = document.getElementById("inputText").value.normalize('NFKC');
        if (!rawInput.trim()) {
          document.getElementById("outputText").innerText = "-";
          document.getElementById("subText").innerText = "-";
          return;
        }

        let cleanedInput = cleanEmphasisSokuon(rawInput);
        let input = resolveLongVowelsContextually(cleanedInput);
        let rawResult = "";
        let i = 0;

        while (i < input.length) {
          let matched = false;

          for (const noun of specialProperNouns) {
            const normalizedNoun = noun.normalize('NFKC');
            if (input.startsWith(normalizedNoun, i)) {
              rawResult += noun;
              i += normalizedNoun.length;
              matched = true;
              break;
            }
          }

          if (!matched) {
            for (const item of melnicsToAlpha) {
              if (input.startsWith(item.kana, i)) {
                rawResult += item.letter;
                i += item.kana.length;
                matched = true;
                break;
              }
            }
          }

          if (!matched) {
            rawResult += input[i];
            i++;
          }
        }

        const formattedResult = formatSentenceCase(rawResult);
        document.getElementById("outputText").innerText = formattedResult;
        fetchJapaneseTranslation(formattedResult);
      } catch (err) {
        console.error(err);
      }
    }
  </script>

</body>
</html>
